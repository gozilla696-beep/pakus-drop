<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05050d">
<title>Pakus Drop — White Gutters</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#05050d}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#05050d}</style>
</head>
<body>
<iframe id="app" src="./progression-test.html?v=auto-progression-2"></iframe>
<script>
const app=document.getElementById('app');
let runToken='',handled=new Set();
function progressionDoc(){try{return app.contentDocument}catch{return null}}
function campFrame(){try{return progressionDoc()?.getElementById('camp')}catch{return null}}
function campDoc(){try{return campFrame()?.contentDocument}catch{return null}}
function campWin(){try{return campFrame()?.contentWindow}catch{return null}}
function gameFrame(){try{return campDoc()?.getElementById('game')}catch{return null}}
function gameDoc(){try{return gameFrame()?.contentDocument}catch{return null}}
function gameWin(){try{return gameFrame()?.contentWindow}catch{return null}}
function forceLayout(){
  const d=gameDoc(); if(!d)return false;
  const wrap=d.querySelector('.boardWrap'); const board=d.querySelector('.board');
  if(wrap){wrap.style.setProperty('background','#ffffff','important');wrap.style.setProperty('border','2px solid #ffffff','important');wrap.style.setProperty('box-shadow','0 0 0 1px rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.6)','important');wrap.style.setProperty('padding','7px','important')}
  if(board){board.style.setProperty('background','#05050d','important');board.style.setProperty('border','1px solid rgba(255,255,255,.45)','important')}
  const controls=d.querySelector('.controls');if(controls){controls.style.setProperty('gap','7px','important');controls.style.setProperty('margin-top','6px','important')}
  [['left','#183d52','#3f9bc1'],['right','#183d52','#3f9bc1'],['rotate','#33234f','#8060b6'],['down','#40301a','#b78b3d']].forEach(([id,bg,bd])=>{const e=d.getElementById(id);if(e){e.style.setProperty('min-height','58px','important');e.style.setProperty('font-size','32px','important');e.style.setProperty('background',bg,'important');e.style.setProperty('border-color',bd,'important')}});
  ['drop','restart'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.setProperty('min-height','48px','important')});
  return true;
}
function once(key,fn){if(handled.has(key))return;handled.add(key);try{fn()}catch{}}
function freezeGame(ms){const w=gameWin();if(!w)return;try{w.eval(`freezeUntil=Math.max(freezeUntil||0,Date.now()+${ms});`)}catch{}}
function show(id,on){const e=gameDoc()?.getElementById(id);if(e)e.style.setProperty('display',on?'':'none','important')}
function autoProgress(){
  const d=gameDoc(),w=gameWin(),cw=campWin();if(!d||!w)return;
  const level=Number(d.getElementById('level')?.textContent||1),score=Number(d.getElementById('score')?.textContent||0);
  if(!runToken)runToken=String(Date.now());
  if(level===1&&score===0&&handled.size>0){handled=new Set();runToken=String(Date.now())}

  show('shoot',level>=5);
  show('placeTower',level>=7); show('typeRapid',level>=7);
  show('typeLaser',level>=10); show('upgrade',level>=10); show('tdMode',level>=10);
  show('bonusGame',level>=12);
  show('typeBomb',level>=15);
  show('overdrive',level>=20); show('blast',level>=25);

  if(level>=5)once('L5',()=>w.eval("gunUntil=Math.max(gunUntil,Date.now()+12000); render(); banner('🔫 WAFFE FREI');"));
  if(level>=7)once('L7',()=>w.eval("towerCredits+=2; render(); banner('🗼 TOWER FREI');"));
  if(level>=10)once('L10',()=>{w.eval("towerCredits+=1; render(); tdMode();")});
  if(level>=12)once('L12',()=>{freezeGame(22000);w.eval("openBonus();")});
  if(level>=15)once('L15',()=>w.eval("towerCredits+=2; towerType='bomb'; render(); banner('💣 BOMBEN-TOWER');"));
  if(level>=20)once('L20',()=>w.eval("energy=100; render(); banner('🔥 OVERDRIVE BEREIT');"));
  if(level>=25)once('L25',()=>w.eval("score+=250; render(); banner('💥 PULSE BEREIT');"));
  if(level>=30)once('L30',()=>w.eval("tdMode();"));
  if(level>=40)once('L40',()=>{freezeGame(22000);w.eval("openBonus();")});
  if(level>=50)once('L50',()=>w.eval("tdMode();"));
  if(level>=75)once('L75',()=>{freezeGame(22000);w.eval("openBonus();")});
  if(level>=100)once('L100',()=>{freezeGame(30000);if(cw&&typeof cw.startMonster==='function')cw.startMonster(level)});
  if(level>100&&level%25===0)once('MON'+level,()=>{freezeGame(30000);if(cw&&typeof cw.startMonster==='function')cw.startMonster(level)});
}
setInterval(()=>{forceLayout();autoProgress()},160);
app.addEventListener('load',()=>setTimeout(()=>{forceLayout();autoProgress()},700));
window.addEventListener('resize',()=>setTimeout(forceLayout,100));
</script>
</body>
</html>
