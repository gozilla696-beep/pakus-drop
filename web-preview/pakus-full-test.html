<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Pakus Drop Full Test</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#05050d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#game{position:fixed;inset:0;width:100%;height:100%;border:0}.modes{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:9999;border:1px solid #68e8ff;background:linear-gradient(#17495a,#0c2630);color:#fff;border-radius:13px;padding:8px 11px;font-weight:950;font-size:11px}.ov{position:fixed;inset:0;z-index:10000;background:#050510f5;display:none;align-items:center;justify-content:center;padding:12px}.ov.open{display:flex}.panel{width:min(100%,520px);height:min(92dvh,820px);background:linear-gradient(#1b1640,#09091b);border:1px solid #6253a8;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 90px #000}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #343461}.title{font-size:20px;font-weight:950}.close{border:1px solid #6f68a8;background:#242047;color:#fff;border-radius:10px;padding:8px 11px;font-weight:900}.menu{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.modeBtn{min-height:86px;border-radius:16px;border:1px solid #555589;background:linear-gradient(#222247,#111125);color:#fff;font-weight:950;font-size:14px}.modeBtn b{display:block;font-size:30px;margin-bottom:5px}.tdArena{position:relative;flex:1;margin:10px;border-radius:16px;overflow:hidden;background:linear-gradient(#10204b,#0d1737 50%,#101020);border:1px solid #5b65a8}.lane{position:absolute;left:0;right:0;height:20%;border-bottom:1px dashed #59618a33}.tower{position:absolute;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:34px;background:linear-gradient(#153b48,#0d2028);border:1px solid #58e8ff;box-shadow:0 0 18px #55f5ff55;z-index:4}.enemy{position:absolute;font-size:34px;transition:left .09s linear;filter:drop-shadow(0 0 8px #ff4b6e)}.beam{position:absolute;height:4px;background:linear-gradient(90deg,#fff,#62ffff,transparent);transform-origin:left center;box-shadow:0 0 10px #55f5ff;z-index:3}.hud{padding:0 12px 12px;display:flex;gap:8px;justify-content:space-between;font-size:12px}.ballArena{position:relative;flex:1;margin:10px;border-radius:16px;overflow:hidden;background:linear-gradient(#153064,#54286e 55%,#14142d);border:1px solid #7268b0}.balloon{position:absolute;width:54px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:inset -8px -10px 14px #0003,0 0 14px currentColor}.bow{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:48px}.arrow{position:absolute;height:4px;background:#ffe8a6;transform-origin:left center;box-shadow:0 0 8px #fff}.monsterArena{position:relative;flex:1;margin:10px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 0,#4a1d68,#141436 55%,#070714);border:1px solid #6456a2}.monster{position:absolute;left:50%;top:14%;transform:translate(-50%,-50%);font-size:72px;filter:drop-shadow(0 0 18px #ff4bd8)}.jet{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:56px}.hp{height:12px;margin:10px 14px;background:#2a1420;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3e68,#ffac42,#ffe15b)}.notice{padding:0 14px 10px;font-size:12px;color:#d7d9f5;text-align:center}</style></head><body><iframe id="game" src="./progression-mobile-white.html?v=fullmodes1"></iframe><button class="modes" id="modes">🎮 MODI</button><div class="ov" id="menu"><div class="panel"><div class="head"><div class="title">🎮 PAKUS MODI · ALLES FREI</div><button class="close" data-close="menu">✕</button></div><div class="menu"><button class="modeBtn" id="td"><b>🗼</b>TOWER DEFENSE</button><button class="modeBtn" id="bonus"><b>🎈</b>BOGEN BONUS</button><button class="modeBtn" id="monster"><b>👹</b>PAKUS MONSTER</button><button class="modeBtn" id="back"><b>🧩</b>HAUPTSPIEL</button></div></div></div><div class="ov" id="tdOv"><div class="panel"><div class="head"><div class="title">🗼 TOWER DEFENSE</div><button class="close" data-close="tdOv">✕</button></div><div class="tdArena" id="tdArena"></div><div class="hud"><span id="tdWave">Welle 1</span><span id="tdKills">0 Kills</span><span id="tdLife">❤️ 10</span></div></div></div><div class="ov" id="ballOv"><div class="panel"><div class="head"><div class="title">🎈 BOGEN-BONUS</div><button class="close" data-close="ballOv">✕</button></div><div class="ballArena" id="ballArena"><div class="bow">🏹</div></div><div class="notice" id="ballInfo">Treffer 0 · 20s</div></div></div><div class="ov" id="monOv"><div class="panel"><div class="head"><div class="title">👹 PAKUS MONSTER</div><button class="close" data-close="monOv">✕</button></div><div class="hp"><i id="monHp"></i></div><div class="monsterArena" id="monArena"><div class="monster" id="mon">👹</div><div class="jet" id="jet">✈️</div></div><div class="notice" id="monInfo">Jet bewegen · automatisch feuern · Monster nach unten drücken</div></div></div><script>const $=x=>document.getElementById(x);$('modes').onclick=()=>$('menu').classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));$('back').onclick=()=>$('menu').classList.remove('open');let tdTimer,spawnTimer,kills=0,life=10,wave=1;function startTD(){$('menu').classList.remove('open');$('tdOv').classList.add('open');const a=$('tdArena');a.innerHTML='';kills=0;life=10;wave=1;for(let i=0;i<5;i++){const l=document.createElement('div');l.className='lane';l.style.top=(i*20)+'%';a.appendChild(l)}[[9,1,'⚡'],[9,3,'🔷'],[9,5,'💣']].forEach(([x,y,e],i)=>{const t=document.createElement('div');t.className='tower';t.textContent=e;t.style.left='5%';t.style.top=(14+i*27)+'%';a.appendChild(t)});clearInterval(tdTimer);clearInterval(spawnTimer);spawnTimer=setInterval(()=>spawnEnemy(a),900);tdTimer=setInterval(()=>fireTowers(a),520);updateTD()}function spawnEnemy(a){const e=document.createElement('div');e.className='enemy';e.textContent=Math.random()<.25?'👹':'👾';e.dataset.hp=Math.random()<.3?3:2;e.style.left='92%';e.style.top=(8+Math.floor(Math.random()*5)*18)+'%';a.appendChild(e)}function fireTowers(a){[...a.querySelectorAll('.enemy')].forEach(e=>{let x=parseFloat(e.style.left);x-=2.2+.2*wave;e.style.left=x+'%';if(Math.random()<.42){e.dataset.hp=Number(e.dataset.hp)-1;const b=document.createElement('div');b.className='beam';b.style.left='14%';b.style.top=(parseFloat(e.style.top)+4)+'%';b.style.width=Math.max(20,x-14)+'%';a.appendChild(b);setTimeout(()=>b.remove(),120)}if(Number(e.dataset.hp)<=0){e.remove();kills++;if(kills%10===0)wave++;updateTD()}else if(x<10){e.remove();life--;updateTD();if(life<=0){clearInterval(tdTimer);clearInterval(spawnTimer);$('tdLife').textContent='💀 GAME OVER'}}})}function updateTD(){$('tdWave').textContent='Welle '+wave;$('tdKills').textContent=kills+' Kills';$('tdLife').textContent='❤️ '+life}$('td').onclick=startTD;let ballEnd=0,ballTimer,hits=0;function startBall(){$('menu').classList.remove('open');$('ballOv').classList.add('open');hits=0;ballEnd=Date.now()+20000;clearInterval(ballTimer);ballTimer=setInterval(()=>{spawnBall();const left=Math.max(0,Math.ceil((ballEnd-Date.now())/1000));$('ballInfo').textContent='Treffer '+hits+' · '+left+'s';if(left<=0){clearInterval(ballTimer);$('ballInfo').textContent='🎁 '+hits+' Treffer · Spezialbonus gewonnen'}},550)}function spawnBall(){if(Date.now()>ballEnd)return;const a=$('ballArena'),b=document.createElement('div'),gold=Math.random()<.18;b.className='balloon';b.style.left=(5+Math.random()*82)+'%';b.style.top=(6+Math.random()*68)+'%';b.style.background=gold?'#ffd84f':['#ff4f7b','#55e8ff','#6cff8f','#c875ff'][Math.floor(Math.random()*4)];b.textContent=gold?'⭐':'';b.onclick=()=>{hits+=gold?2:1;const r=b.getBoundingClientRect(),ar=a.getBoundingClientRect(),sx=ar.width/2,sy=ar.height-45,x=r.left-ar.left+r.width/2,y=r.top-ar.top+r.height/2,q=document.createElement('div');q.className='arrow';q.style.left=sx+'px';q.style.top=sy+'px';q.style.width=Math.hypot(x-sx,y-sy)+'px';q.style.transform='rotate('+Math.atan2(y-sy,x-sx)+'rad)';a.appendChild(q);setTimeout(()=>q.remove(),180);b.remove()};a.appendChild(b);setTimeout(()=>b.remove(),1800)}$('bonus').onclick=startBall;let mhp=100,monTimer;function startMon(){$('menu').classList.remove('open');$('monOv').classList.add('open');mhp=100;$('monHp').style.width='100%';$('mon').style.top='14%';clearInterval(monTimer);monTimer=setInterval(()=>{mhp-=2;$('monHp').style.width=mhp+'%';$('mon').style.top=(14+(100-mhp)*.55)+'%';if(mhp<=0){clearInterval(monTimer);$('monInfo').textContent='⭐ BESIEGT! +100 CAMP-STERNE'}},180)}$('monster').onclick=startMon;const arena=$('monArena');arena.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse')return;const r=arena.getBoundingClientRect();$('jet').style.left=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100))+'%'});</script></body></html>
