<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070714">
<title>Pakus Drop — DEV Test</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070714;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#camp{position:fixed;inset:0;width:100%;height:100%;border:0;background:#070714}.dev{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:999;display:grid;grid-template-columns:1fr 1fr;gap:7px;width:min(330px,calc(100vw - 20px))}.dev button{border:1px solid #ffbf42;background:linear-gradient(#5b3310,#2a1809);color:#fff;border-radius:14px;padding:10px 10px;font-size:10px;font-weight:950;box-shadow:0 8px 26px #000a}.dev .monster{border-color:#ff4bd8;background:linear-gradient(#5b164d,#291023)}.dev .stars{border-color:#77eeff;background:linear-gradient(#104852,#0b252b)}.dev .tower{border-color:#5fffff;background:linear-gradient(#10454c,#0a2529)}.dev .bonus{border-color:#7dff83;background:linear-gradient(#174a20,#0d2912)}.dev .special{border-color:#ff7d6b;background:linear-gradient(#5a1d16,#2b100d)}.dev .scroll{border-color:#b799ff;background:linear-gradient(#35205a,#1b1233)}.badge{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:999;background:#8b152b;border:1px solid #ff607e;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:950;letter-spacing:.6px;box-shadow:0 5px 18px #0008}.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 44px);transform:translateX(-50%);z-index:1000;background:#181833;border:1px solid #6666a5;border-radius:99px;padding:9px 14px;font-size:11px;font-weight:900;opacity:0;transition:.18s;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1}
</style>
</head>
<body>
<iframe id="camp" src="./camp-edition.html?v=dev-20260909-2"></iframe>
<div class="badge">🧪 DEV TEST 2</div>
<div class="dev">
<button id="lvl100">⚡ LEVEL 100</button>
<button class="monster" id="monster">👹 MONSTER</button>
<button class="stars" id="stars">⭐ +500 STERNE</button>
<button class="tower" id="tower">🗼 TOWER TEST</button>
<button class="special" id="special">🧱 SPECIALS</button>
<button class="bonus" id="bonus">🎈 BONUS GAME</button>
<button class="scroll" id="controls">🎮 ZU CONTROLS</button>
<button class="scroll" id="refresh">🔄 NEU LADEN</button>
</div>
<div class="toast" id="toast"></div>
<script>
const frame=document.getElementById('camp'),toast=document.getElementById('toast');
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1900)}
function app(){try{return frame.contentWindow}catch{return null}}
function gameFrame(){try{return app()?.document.getElementById('game')}catch{return null}}
function gameDoc(){try{return gameFrame()?.contentDocument}catch{return null}}
function gameWin(){try{return gameFrame()?.contentWindow}catch{return null}}
function forceFreshGame(){const gf=gameFrame();if(!gf)return;const wanted='./index.html?v=dev-20260909-2';if(!gf.src.includes('dev-20260909-2'))gf.src=wanted}
function setLevel100(){const d=gameDoc(),w=gameWin();if(!d||!w){msg('Spiel lädt noch …');return false}try{w.eval("level=100; nextLevelAt=Date.now()-startTime+30000; restartTimer(); restartHazards(); render();");app()?.hookBonus?.(100);msg('⚡ Echtes Spiel-Level auf 100 gesetzt');return true}catch(e){const el=d.getElementById('level');if(el)el.textContent='100';msg('⚡ Level-Anzeige auf 100 gesetzt');return !!el}}
function startMonster(){const w=app();if(!w){msg('Camp lädt noch …');return}try{setLevel100();w.startMonster?.(100);msg('👹 Pakus Monster Level 100 gestartet')}catch(e){msg('Monster-Test noch nicht bereit')}}
function addStars(){const w=app();if(!w){msg('Camp lädt noch …');return}try{w.camp.stars=(Number(w.camp.stars)||0)+500;w.saveCamp?.();w.renderDock?.();w.renderCamp?.();msg('⭐ +500 Test-Sterne')}catch(e){msg('Sterne-Test noch nicht bereit')}}
function towerTest(){const w=gameWin();if(!w){msg('Spiel lädt noch …');return}try{w.eval("towerCredits=5; render();");gameDoc()?.getElementById('placeTower')?.click();msg('🗼 5 Tower-Kits + 1 Turm gebaut')}catch(e){msg('Tower-Test noch nicht bereit')}}
function specialTest(){const w=gameWin();if(!w){msg('Spiel lädt noch …');return}try{w.eval("grid[12][2]={type:'armored',hp:6};grid[12][3]={type:'grower',hp:1};grid[12][4]={type:'shifter',hp:1};grid[12][5]={type:'meteor',hp:5};grid[12][6]={type:'invader',hp:8,inv:true};render();");msg('🧱 Panzer, Wachstum, Shifter, Meteor + Invader gespawnt')}catch(e){msg('Special-Test noch nicht bereit')}}
function openBonus(){const d=gameDoc();if(!d){msg('Spiel lädt noch …');return}const b=d.getElementById('bonusGame');if(!b){msg('Bonus-Button fehlt – neu laden');return}b.click();msg('🎈 Bonus-Spiel geöffnet')}
function showControls(){const d=gameDoc();if(!d)return;const c=d.querySelector('.controls');if(c){c.scrollIntoView({behavior:'smooth',block:'start'});msg('🎮 Controls angezeigt')}}
function refreshAll(){frame.src='./camp-edition.html?v=dev-'+Date.now();msg('🔄 Frische Version wird geladen')}
document.getElementById('lvl100').onclick=setLevel100;document.getElementById('monster').onclick=startMonster;document.getElementById('stars').onclick=addStars;document.getElementById('tower').onclick=towerTest;document.getElementById('special').onclick=specialTest;document.getElementById('bonus').onclick=openBonus;document.getElementById('controls').onclick=showControls;document.getElementById('refresh').onclick=refreshAll;
frame.addEventListener('load',()=>setTimeout(()=>{forceFreshGame();setTimeout(()=>msg('🧪 DEV TEST 2 bereit · frischer Spielcode'),700)},350));
</script>
</body>
</html>
