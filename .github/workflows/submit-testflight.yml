name: Inspect Pakus Drop TestFlight Submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-testflight.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Show failed iOS submission details
        run: eas submit:view ff870732-6147-42c2-952d-7387880eea6a --json
