name: Submit Pakus Drop to TestFlight

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Wait for diagnostic build 21 and submit exact build
        env:
          BUILD_ID: e9b67f34-c287-40c3-a400-09e6b7be0b4f
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            STATUS=$(eas build:view "$BUILD_ID" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.status||'UNKNOWN')})")
            echo "EAS build status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              break
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Build cannot be submitted: $STATUS"
              exit 1
            fi
            sleep 30
          done

          STATUS=$(eas build:view "$BUILD_ID" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.status||'UNKNOWN')})")
          if [ "$STATUS" != "FINISHED" ]; then
            echo "Timed out waiting for EAS build to finish."
            exit 1
          fi

          eas submit --platform ios --id "$BUILD_ID" --profile production --non-interactive
