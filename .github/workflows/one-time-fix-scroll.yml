name: One-time Pakus Drop scroll fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-scroll.yml'

permissions:
  contents: write

jobs:
  fix-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable scrolling on game screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old = '<ScrollView contentContainerStyle={styles.page} scrollEnabled={shopOpen}>'
          new = '<ScrollView contentContainerStyle={styles.page} scrollEnabled>'
          if old not in s:
              raise SystemExit('Expected ScrollView line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-scroll.yml
          git add App.tsx
          git commit -m "Fix game screen scrolling on iPhone"
          git push
